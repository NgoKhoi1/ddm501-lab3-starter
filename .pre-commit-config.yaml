# =============================================================================
# Pre-commit hooks configuration
# DDM501 - Lab 3: Testing & CI/CD
#
# Setup:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
# =============================================================================

repos:
  # ===========================================================================
  # Standard pre-commit hooks
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # ===========================================================================
  # Black formatter
  # ===========================================================================
  # No language_version pin, so the hook uses whatever Python 3 is installed
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: ['--line-length=100']

  # ===========================================================================
  # isort for import sorting
  # ===========================================================================
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']

  # ===========================================================================
  # Flake8 linter
  # ===========================================================================
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--exclude=__pycache__,venv']

  # ===========================================================================
  # mypy type checker
  # ===========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        files: ^app/
        additional_dependencies:
          - types-requests
          - pydantic==2.5.2
          - fastapi==0.104.1
        args: ['--ignore-missing-imports']

  # ===========================================================================
  # pytest hook
  # ===========================================================================
  # Runs unit tests before every commit (uses the active virtual environment)
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest tests/unit/ -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
