# =============================================================================
# CI Pipeline for Movie Rating API
# DDM501 - Lab 3: Testing & CI/CD
# =============================================================================

name: CI Pipeline

# =============================================================================
# Triggers
# =============================================================================
# - Run on push to main and develop branches
# - Run on pull requests to main branch

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ===========================================================================
  # Linting Job
  # ===========================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.0.0 black==23.12.1 isort==5.13.2

      - name: Run flake8
        run: flake8 app/ tests/ scripts/ --max-line-length=100 --exclude=__pycache__

      - name: Check black formatting
        run: black --check app/ tests/ scripts/

      - name: Check import sorting
        run: isort --check-only app/ tests/ scripts/

  # ===========================================================================
  # Type Checking Job
  # ===========================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # scikit-surprise 1.1.3 ships only as source: build it against the
      # pinned numpy instead of letting pip pull the latest numpy
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel "cython<3" numpy==1.26.2
          pip install scikit-surprise==1.1.3 --no-build-isolation
          pip install -r requirements.txt
          pip install mypy==1.8.0 types-requests==2.31.0

      - name: Run mypy
        run: mypy app/ --ignore-missing-imports

  # ===========================================================================
  # Test Job
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache MovieLens dataset
        uses: actions/cache@v4
        with:
          path: ~/.surprise_data
          key: surprise-data-ml-100k

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel "cython<3" numpy==1.26.2
          pip install scikit-surprise==1.1.3 --no-build-isolation
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Train model
        run: python scripts/train_model.py

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Share the trained model with the build job
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/svd_model.pkl
          retention-days: 1

  # ===========================================================================
  # Build Job
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, type-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Build Docker image
        run: docker build -t movie-rating-api:test .

      - name: Test Docker image
        run: |
          docker run -d -p 8000:8000 --name test-api movie-rating-api:test
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 1
          done
          echo
          curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"user_id": "196", "movie_id": "242"}'

      - name: Show container logs
        if: always()
        run: docker logs test-api || true

      - name: Stop container
        if: always()
        run: docker rm -f test-api || true
