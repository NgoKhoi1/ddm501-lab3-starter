# =============================================================================
# CD Pipeline for Movie Rating API
# DDM501 - Lab 3: Testing & CI/CD
#
# Required repository secrets:
#   DOCKER_USERNAME - Docker Hub username
#   DOCKER_PASSWORD - Docker Hub access token
# =============================================================================

name: CD Pipeline

# =============================================================================
# Triggers
# =============================================================================
# Run when a version tag is pushed (e.g., v1.0.0, v1.2.3)

on:
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ===========================================================================
  # Build and Push Docker Image
  # ===========================================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache MovieLens dataset
        uses: actions/cache@v4
        with:
          path: ~/.surprise_data
          key: surprise-data-ml-100k

      # The model file is not committed, so train it before building the image
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel "cython<3" numpy==1.26.2
          pip install scikit-surprise==1.1.3 --no-build-isolation
          pip install -r requirements.txt

      - name: Train model
        run: python scripts/train_model.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:latest
            ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for version ${{ github.ref_name }}

            Docker image:
            `docker pull ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ github.ref_name }}`
          draft: false
          prerelease: false

  # ===========================================================================
  # Deploy to Staging
  # ===========================================================================
  # In a real scenario, this might deploy to AWS, GCP, Azure, etc.

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying movie-rating-api:${{ github.ref_name }} to staging environment..."
          # Add deployment commands here

  # ===========================================================================
  # Deploy to Production
  # ===========================================================================
  # Add required reviewers to the "production" environment in the repository
  # settings to require manual approval before this job runs

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "Deploying movie-rating-api:${{ github.ref_name }} to production environment..."
          # Add deployment commands here
